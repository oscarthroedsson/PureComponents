<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search Input — PureComponents</title>
    <meta name="pc-description" content="Search inputs should use role=&quot;search&quot; on the form element and proper ARIA attributes." />

    <!-- Library CSS under test -->
    <link rel="stylesheet" href="../../src/Styles/main.css" />
    <link rel="stylesheet" href="../../src/Styles/Form/inputs/search.css" />
    <link rel="stylesheet" href="../../src/Styles/Form/inputs/formField.css" />
    <link rel="stylesheet" href="../../src/Styles/button.css" />

    <!-- Dev shell (not part of the library) -->
    <link rel="stylesheet" href="../docs.css" />
  </head>
  <body data-component="Form/Search">
  <section class="pc-demo" id="basic-usage" data-title="Basic Usage">
    <template>
      <form role="search" aria-label="Site search">
        <div class="formField">
          <label for="search-basic" class="visually-hidden">Search</label>
          <input
            type="search"
            id="search-basic"
            class="search-input md"
            placeholder="Search..."
            aria-label="Search site"
          />
          <button type="submit" class="btn md">Search</button>
        </div>
      </form>
    </template>
  </section>

  <section class="pc-demo" id="size-variants" data-title="Size Variants" data-stage-style="display: flex; flex-direction: column; gap: 1rem;">
    <p class="pc-note">Search inputs support three sizes: small (sm), medium (md), and large (lg).</p>
    <template>
      <form role="search">
        <div class="formField">
          <label for="small-search" class="visually-hidden">Search</label>
          <input type="search" id="small-search" class="search-input sm" placeholder="Small search" />
        </div>
      </form>
      <form role="search">
        <div class="formField">
          <label for="medium-search" class="visually-hidden">Search</label>
          <input type="search" id="medium-search" class="search-input md" placeholder="Medium search" />
        </div>
      </form>
      <form role="search">
        <div class="formField">
          <label for="large-search" class="visually-hidden">Search</label>
          <input type="search" id="large-search" class="search-input lg" placeholder="Large search" />
        </div>
      </form>
    </template>
  </section>

  <section class="pc-demo" id="with-search-icon-button" data-title="With Search Icon Button">
    <p class="pc-note">Search inputs can include an icon button for submission.</p>
    <template>
      <form role="search" class="search-form">
        <label for="icon-search" class="visually-hidden">Search</label>
        <div class="search-wrapper">
          <input
            type="search"
            id="icon-search"
            class="search-input md"
            placeholder="Search..."
            aria-label="Search site"
          />
          <button type="submit" class="search-button" aria-label="Submit search">
            <svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001c.03.04 2.092 2.025 2.092 2.025L13 13.5l-1.258-1.156zM6 10.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9z"/>
            </svg>
          </button>
        </div>
      </form>
    </template>
  </section>

  <section class="pc-demo" id="accessibility-requirements" data-title="Accessibility Requirements">
    <p class="pc-note">Search inputs must have proper ARIA attributes and semantic HTML for screen reader support.</p>
    <template>
      <form role="search" aria-label="Site search">
        <div class="formField">
          <label for="accessible-search" class="visually-hidden">Search</label>
          <input
            type="search"
            id="accessible-search"
            class="search-input md"
            placeholder="Search..."
            aria-label="Search site"
            aria-describedby="search-help"
          />
          <p id="search-help" class="helpText">Enter keywords to search</p>
        </div>
      </form>
    </template>
  </section>

    <script src="../components.js"></script>
    <script src="../docs.js"></script>
  </body>
</html>
