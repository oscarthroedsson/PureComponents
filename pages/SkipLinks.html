<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skip Links — PureComponents</title>
    <meta name="pc-description" content="Skip links allow keyboard users to skip to main content or navigation. They are hidden by default and appear when focused." />

    <!-- Library CSS under test -->
    <link rel="stylesheet" href="../src/Styles/main.css" />
    <link rel="stylesheet" href="../src/Styles/skip-links.css" />

    <!-- Dev shell (not part of the library) -->
    <link rel="stylesheet" href="./docs.css" />
  </head>
  <body data-component="SkipLinks">
  <section class="pc-demo" id="basic-usage" data-title="Basic Usage" data-stage-style="position: relative; min-height: 200px;">
    <template>
      <a href="#main-content" class="skip-link md">Skip to main content</a>
      <p style="margin-top: 3rem;">Tab to see the skip link appear at the top.</p>
      <div id="main-content" style="margin-top: 2rem; padding: 1rem; background: var(--color-neutral-100); border-radius: var(--radius-sm);">
        Main content area (target of skip link)
      </div>
    </template>
  </section>

  <section class="pc-demo" id="multiple-skip-links" data-title="Multiple Skip Links" data-stage-style="position: relative; min-height: 300px;">
    <p class="pc-note">You can provide multiple skip links for different sections of the page.</p>
    <template>
      <div class="skip-links">
        <a href="#navigation" class="skip-link md">Skip to navigation</a>
        <a href="#main-content-2" class="skip-link md">Skip to main content</a>
        <a href="#footer" class="skip-link md">Skip to footer</a>
      </div>
      <p style="margin-top: 3rem;">Tab to see the skip links appear.</p>
      <nav id="navigation" style="margin-top: 2rem; padding: 1rem; background: var(--color-neutral-100); border-radius: var(--radius-sm);">
        Navigation area
      </nav>
      <main id="main-content-2" style="margin-top: 2rem; padding: 1rem; background: var(--color-neutral-100); border-radius: var(--radius-sm);">
        Main content area
      </main>
      <footer id="footer" style="margin-top: 2rem; padding: 1rem; background: var(--color-neutral-100); border-radius: var(--radius-sm);">
        Footer area
      </footer>
    </template>
  </section>

  <section class="pc-demo" id="size-variants" data-title="Size Variants" data-stage-style="position: relative; min-height: 200px;">
    <p class="pc-note">Skip links support three sizes: small (sm), medium (md), and large (lg).</p>
    <template>
      <a href="#target-sm" class="skip-link sm">Small Skip Link</a>
      <a href="#target-md" class="skip-link md">Medium Skip Link</a>
      <a href="#target-lg" class="skip-link lg">Large Skip Link</a>
      <p style="margin-top: 3rem;">Tab to see the different sized skip links.</p>
    </template>
  </section>

  <section class="pc-demo" id="accessibility-requirements" data-title="Accessibility Requirements" data-stage-style="position: relative; min-height: 200px;">
    <p class="pc-note">Skip links must be the first focusable elements on the page and must have high contrast for visibility.</p>
    <template>
      <a href="#accessible-content" class="skip-link md">Skip to main content</a>
      <p style="margin-top: 3rem;">Tab to focus the skip link - it will appear at the top with high contrast.</p>
      <div id="accessible-content" style="margin-top: 2rem; padding: 1rem; background: var(--color-neutral-100); border-radius: var(--radius-sm);">
        Target content
      </div>
    </template>
  </section>

    <script src="./components.js"></script>
    <script src="./docs.js"></script>
  </body>
</html>
