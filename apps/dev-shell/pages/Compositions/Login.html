<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login — Pure Composition</title>

    <!-- Dev shell only. Composition CSS is loaded inside each lazy preview. -->
    <link rel="stylesheet" href="../docs.css" />
  </head>
  <body data-page="compositions">
    <noscript>
      <p style="padding: 2rem; font-family: system-ui">
        Composition examples are loaded on demand and need JavaScript.
      </p>
    </noscript>

    <script src="../components.js"></script>
    <script src="./compositions.js"></script>
    <script src="../docs.js"></script>
    <script src="./Login/examples.js"></script>
    <script type="module">
      import "./composition-viewer.js";

      (function () {
        "use strict";

        var el = window.PCDocs.el;

        var about = el("div", { class: "pc-doc-body" });
        about.innerHTML =
          "<p>A sign-in card, rebuilt from a shadcn/ui screenshot with <strong>no CSS of its own</strong>. " +
          "Every box, space, surface and state below comes from PureUI: Card carries the frame and its parts, " +
          "Form and Field carry the fields, Layout puts the password label beside its reset link, and Behavior " +
          "makes the two buttons fill the footer.</p>" +
          "<p>What the library cannot do shows up here rather than being patched: the card has no width of its " +
          "own, so it is held to its content with <code>data-behavior=\"compact\"</code>, and the sign-up line " +
          "borrows <code>card-subtitle</code> because there is no text class to make it muted.</p>";

        var feed = el("div");
        window.PCCompositionViewer.mount(feed, {
          name: "Login",
          examples: window.PC_LOGIN_EXAMPLES || [],
        });

        var adding = el("div", { class: "pc-doc-body" });
        adding.innerHTML =
          "<ol>" +
          "<li>Create a module in <code>Login/examples/</code> that exports its stylesheets and markup.</li>" +
          "<li>Add its title, module path and stable preview height to <code>Login/examples.js</code>.</li>" +
          "<li>Reload this page. The shared viewer supplies lazy loading, isolation, tabs and copying.</li>" +
          "</ol>";

        window.PCDocs.buildPage({
          title: "Login",
          lede: "A sign-in card built only from PureUI classes.",
          homeHref: "../../index.html",
          sections: [
            { id: "about", title: "About", node: about },
            { id: "examples", title: "Examples", node: feed },
            { id: "adding-an-example", title: "Add an example", node: adding },
          ],
        });
      })();
    </script>
  </body>
</html>
