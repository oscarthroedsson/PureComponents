<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link (a) — Elements</title>
    <meta name="pc-description" content="The A-tag component provides styled links with hover effects and accessibility support." />

    <!-- Library CSS under test -->
    <link rel="stylesheet" href="/pureui/styles/main.css" />
    <link rel="stylesheet" href="/pureui/styles/a-tag.css" />

    <!-- Dev shell (not part of the library) -->
    <link rel="stylesheet" href="./docs.css" />
  </head>
  <body data-component="ATag">
  <section class="pc-demo" id="basic-usage" data-title="Basic Usage" data-stage-style="display: flex; flex-direction: column; gap: 1rem">
    <template>
      <a href="#link1" class="pu-link">Basic Link</a>
      <a href="#link2" class="pu-link">Another Link</a>
      <a href="#link3" class="pu-link">Link with Hover Effect</a>
    </template>
  </section>

  <section class="pc-demo" id="external-links" data-title="External Links">
    <p class="pc-note">External links should include <code>target="_blank"</code> and <code>rel="noopener noreferrer"</code> for security.</p>
    <template>
      <a href="https://example.com" class="pu-link" target="_blank" rel="noopener noreferrer"
        >External Link</a
      >
    </template>
  </section>

  <section class="pc-demo" id="email-and-phone-links" data-title="Email and Phone Links" data-stage-style="display: flex; flex-direction: column; gap: 1rem">
    <p class="pc-note">Links can use <code>mailto:</code> and <code>tel:</code> protocols for email and phone numbers.</p>
    <template>
      <a href="mailto:contact@example.com" class="pu-link">contact@example.com</a>
      <a href="tel:+1234567890" class="pu-link">+1 (234) 567-890</a>
    </template>
  </section>

  <section class="pc-demo" id="accessibility-requirements" data-title="Accessibility Requirements">
    <p class="pc-note">Links must have proper attributes and descriptive text for screen reader support.</p>
    <template>
      <a href="#accessible" class="pu-link" aria-label="Read more about accessibility">Accessible Link</a>
    </template>
  </section>

    <script src="./components.js"></script>
    <script src="./docs.js"></script>
  </body>
</html>
