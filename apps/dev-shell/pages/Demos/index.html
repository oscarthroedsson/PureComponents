<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Demos — Pure</title>

    <!-- The library's tokens, so future demos theme with everything else -->
    <link rel="stylesheet" href="/pureui/styles/main.css" />

    <!-- Dev shell (not part of the library) -->
    <link rel="stylesheet" href="../docs.css" />
  </head>
  <body data-page="demos">
    <script src="../components.js"></script>
    <script src="./demos.js"></script>
    <script src="../docs.js"></script>
    <script>
      (function () {
        var el = window.PCDocs.el;
        var demos = window.PC_DEMOS || [];
        var node;

        if (demos.length) {
          var list = el("ul", { class: "pc-demo-list" });

          demos.forEach(function (demo) {
            list.appendChild(
              el("li", {}, [
                el("a", { class: "pc-demo-card", href: "./" + demo.file }, [
                  el("span", { class: "pc-demo-title", text: demo.title }),
                  el("span", { class: "pc-demo-blurb", text: demo.blurb || "" }),
                ]),
              ]),
            );
          });

          node = list;
        } else {
          node = el("p", {
            class: "pc-empty",
            text: "No demos yet. The things we build to test and show PureUI will appear here.",
          });
        }

        window.PCDocs.buildPage({
          title: "Demos",
          lede: "Things built to test PureUI and show what it can do.",
          homeHref: "../../index.html",
          sections: [{ id: "demos", title: "Demos", node: node }],
        });
      })();
    </script>

    <style>
      /* Dev shell page chrome. */
      .pc-demo-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 0.75rem;
      }
      .pc-demo-card {
        display: grid;
        gap: 0.35rem;
        padding: 1rem 1.1rem;
        border: 1px solid var(--pc-border);
        border-radius: var(--pc-radius);
        background: var(--pc-bg-raised);
        color: inherit;
        text-decoration: none;
      }
      .pc-demo-card:hover {
        border-color: var(--pc-border-strong);
      }
      .pc-demo-title {
        font-weight: 600;
        font-size: 1.05rem;
      }
      .pc-demo-blurb {
        color: var(--pc-text-dim);
        font-size: 0.9rem;
      }
    </style>
  </body>
</html>
